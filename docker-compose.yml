version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devmate-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devmate
      MYSQL_USER: devmate
      MYSQL_PASSWORD: devmate
    volumes:
      - devmate-mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: devmate-redis
    ports:
      - "6379:6379"

volumes:
  devmate-mysql-data: