version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devmate-mysql
    ports:
      - "3307:3306"
    environment:
      DB_URL: ${DB_URL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - devmate-mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: devmate-redis
    ports:
      - "6379:6379"

volumes:
  devmate-mysql-data: