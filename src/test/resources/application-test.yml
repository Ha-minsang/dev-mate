spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  batch:
    job:
      enabled: false
  autoconfigure:
    exclude:
      - io.github.haminsang.notification.sse.config.SseNotificationAutoConfiguration

github:
  token: test
  owner: test
  repo: test

slack:
  webhook:
    url: test

notification:
  email:
    from: test@test.com